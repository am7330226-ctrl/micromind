<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MicroMind Side Panel</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="sidepanel-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="logo">🧠</span>
        <h1>MicroMind</h1>
      </div>
      <div class="stats-badge">
        <span id="streakCount">🔥 0d</span>
      </div>
    </header>

    <!-- Brain Dump Input -->
    <div class="input-section">
      <div class="input-wrapper">
        <input type="text" id="spTaskInput" placeholder="Capture task or thought..." />
        <button id="spAddTaskBtn" class="add-btn">Add</button>
      </div>
    </div>

    <!-- 4-Quadrant Eisenhower Matrix -->
    <div class="matrix-grid">
      <!-- Q1 -->
      <div class="quadrant q1">
        <div class="quadrant-header">
          <div class="indicator"></div>
          <h2>Q1: Do First</h2>
          <span id="q1Count" class="q-count">0</span>
        </div>
        <div id="q1List" class="quadrant-list"></div>
      </div>

      <!-- Q2 -->
      <div class="quadrant q2">
        <div class="quadrant-header">
          <div class="indicator"></div>
          <h2>Q2: Schedule</h2>
          <span id="q2Count" class="q-count">0</span>
        </div>
        <div id="q2List" class="quadrant-list"></div>
      </div>

      <!-- Q3 -->
      <div class="quadrant q3">
        <div class="quadrant-header">
          <div class="indicator"></div>
          <h2>Q3: Delegate</h2>
          <span id="q3Count" class="q-count">0</span>
        </div>
        <div id="q3List" class="quadrant-list"></div>
      </div>

      <!-- Q4 -->
      <div class="quadrant q4">
        <div class="quadrant-header">
          <div class="indicator"></div>
          <h2>Q4: Eliminate</h2>
          <span id="q4Count" class="q-count">0</span>
        </div>
        <div id="q4List" class="quadrant-list"></div>
      </div>
    </div>

    <!-- Inbox List -->
    <div class="inbox-section">
      <h2>Inbox / Unsorted</h2>
      <div id="inboxList" class="inbox-list"></div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
